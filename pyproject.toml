[project]
name = "my-langgraph-agent"
version = "0.1.0"
description = "A LangGraph-based AI agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.0.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.1.0", # Or your preferred provider (anthropic, google, etc.)
    "langchain-ollama>=1.0.0",
    "langchain-tavily>=0.2.0",
    "python-dotenv>=1.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "langgraph-cli>=0.1.0", # Required for LangGraph Studio/CLI local dev
    "ruff>=0.4.0",
]


[tool.hatch.build.targets.wheel]
packages = ["src/your_package"]
